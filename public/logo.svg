<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#2c323b"/>
      <stop offset="60%" stop-color="#16181c"/>
      <stop offset="100%" stop-color="#0d0e11"/>
    </radialGradient>
    
    <!-- Neon Flame Orange Glow -->
    <linearGradient id="primaryFlame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b00"/>
      <stop offset="50%" stop-color="#ff8500"/>
      <stop offset="100%" stop-color="#ffb703"/>
    </linearGradient>

    <!-- Emerald Fruit Glow -->
    <linearGradient id="fruitLeaf" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00b894"/>
      <stop offset="100%" stop-color="#00e676"/>
    </linearGradient>

    <!-- Metallic Bevel -->
    <linearGradient id="metallicBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8500" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#2a2e34" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff3b00" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle with 3D Emboss -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#metallicBorder)" stroke-width="6" filter="url(#softShadow)"/>
  
  <!-- Subtle Internal Grid Lines (DAW Sequencer Pattern aesthetic) -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="2">
    <line x1="80" y1="160" x2="432" y2="160"/>
    <line x1="80" y1="256" x2="432" y2="256"/>
    <line x1="80" y1="352" x2="432" y2="352"/>
    <line x1="168" y1="80" x2="168" y2="432"/>
    <line x1="256" y1="80" x2="256" y2="432"/>
    <line x1="344" y1="80" x2="344" y2="432"/>
  </g>

  <!-- FL Pepper-Sprout Top Leaves (Emerald Green) -->
  <g filter="url(#softShadow)">
    <!-- Left Leaf -->
    <path d="M 230 148 C 210 115 175 110 155 125 C 150 145 175 170 215 165 Z" fill="url(#fruitLeaf)"/>
    <!-- Right Leaf -->
    <path d="M 270 145 C 295 105 340 100 365 115 C 370 138 340 170 295 162 Z" fill="url(#fruitLeaf)"/>
    <!-- Center Stem -->
    <path d="M 248 165 C 248 135 258 115 264 96 C 254 110 242 135 244 165 Z" fill="#00e676"/>
  </g>

  <!-- Main Q-Pepper Silhouette (Clean Modern FL Studio Emblem with Q Tail) -->
  <g filter="url(#flameGlow)">
    <!-- Main Body: Stylized Pepper forming the letter "Q" -->
    <path d="M 256 160
             C 335 160 395 210 395 285
             C 395 350 345 400 275 408
             L 325 450 C 335 458 325 470 310 464
             L 242 410
             C 175 408 120 355 120 285
             C 120 210 180 160 256 160 Z"
          fill="url(#primaryFlame)"/>

    <!-- Inner Core Cutout forming the iconic FL Fruit & Q inner ring -->
    <path d="M 256 205
             C 205 205 168 240 168 285
             C 168 330 205 365 256 365
             C 305 365 345 330 345 285
             C 345 240 305 205 256 205 Z"
          fill="#16181c"/>
  </g>

  <!-- Audio Waveform Pulsing Through Center of Q -->
  <path d="M 185 285
           Q 200 245 212 285
           T 238 285
           Q 248 220 256 285
           T 278 285
           Q 292 235 305 285
           T 328 285"
        fill="none"
        stroke="#ff8500"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Fruit Accent Highlights -->
  <ellipse cx="225" cy="235" rx="14" ry="7" transform="rotate(-30 225 235)" fill="#ffffff" opacity="0.35"/>
  <ellipse cx="305" cy="345" rx="8" ry="4" transform="rotate(25 305 345)" fill="#ffffff" opacity="0.2"/>
</svg>
