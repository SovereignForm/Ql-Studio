<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Gradient: Deep Obsidian & Dark Graphite Studio Finish -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1f232b"/>
      <stop offset="60%" stop-color="#111317"/>
      <stop offset="100%" stop-color="#08090b"/>
    </radialGradient>
    
    <!-- Neon Electric Amber / Flame Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="45%" stop-color="#ff8500"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Quantum Cyan Wave Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Metallic Brushed Chamfer Rim -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8500" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#2a3038" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Dynamic Neon Glow Filter -->
    <filter id="neonGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop Shadow for 3D Studio Hardware Feel -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Base DAW Squircle Hardware Chassis -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="5" filter="url(#dropShadow)"/>

  <!-- Hardware Rack Screws in Corners -->
  <circle cx="56" cy="56" r="5" fill="#2d333b" stroke="#16191f" stroke-width="2"/>
  <circle cx="456" cy="56" r="5" fill="#2d333b" stroke="#16191f" stroke-width="2"/>
  <circle cx="56" cy="456" r="5" fill="#2d333b" stroke="#16191f" stroke-width="2"/>
  <circle cx="456" cy="456" r="5" fill="#2d333b" stroke="#16191f" stroke-width="2"/>

  <!-- Subtle Studio Timeline Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5">
    <line x1="80" y1="170" x2="432" y2="170"/>
    <line x1="80" y1="256" x2="432" y2="256"/>
    <line x1="80" y1="342" x2="432" y2="342"/>
    <line x1="170" y1="80" x2="170" y2="432"/>
    <line x1="256" y1="80" x2="256" y2="432"/>
    <line x1="342" y1="80" x2="342" y2="432"/>
  </g>

  <!-- Independent "Q" Geometry: Modern Futuristic Resonant Ring with Audio Tail -->
  <g filter="url(#neonGlow)">
    <!-- Outer Quantum Ring: Stylized Q with Precision Audio Notch -->
    <path d="M 256 120
             A 136 136 0 1 1 180 368
             L 155 393
             A 170 170 0 1 0 256 86
             Z"
          fill="url(#amberGrad)"/>

    <!-- Inner Quantum Ring Accent (Cyan Contrast) -->
    <path d="M 256 150
             A 106 106 0 0 1 350 305
             L 326 318
             A 76 76 0 0 0 256 180
             Z"
          fill="url(#cyanGrad)"
          opacity="0.85"/>
  </g>

  <!-- Futuristic "L" Waveform Extension (Tail of Q transforms into L and Audio Wave) -->
  <g filter="url(#neonGlow)">
    <!-- Diagonal Precision Fader Slide forming Q Tail & Base of L -->
    <path d="M 295 295
             L 375 375
             L 420 375
             C 428 375 432 385 425 390
             L 360 440
             C 352 446 342 442 340 432
             L 330 380
             L 270 320
             Z"
          fill="url(#amberGrad)"/>

    <!-- High-Precision Center Audio Waveform (Oscilloscope Pulses through the Core) -->
    <path d="M 160 256
             L 190 256
             L 210 205
             L 230 307
             L 256 155
             L 282 357
             L 302 205
             L 322 256
             L 352 256"
          fill="none"
          stroke="#ffffff"
          stroke-width="5"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Cyan Pulse Dots on Peak Coordinates -->
    <circle cx="256" cy="155" r="5" fill="#38bdf8"/>
    <circle cx="282" cy="357" r="4.5" fill="#ff8500"/>
    <circle cx="210" cy="205" r="3.5" fill="#38bdf8"/>
    <circle cx="230" cy="307" r="3.5" fill="#ff8500"/>
  </g>

  <!-- Specular Lens Flare on Apex -->
  <ellipse cx="256" cy="120" rx="20" ry="6" fill="#ffffff" opacity="0.4"/>
</svg>