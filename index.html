<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ql Studio — Modern DAW Engine</title>
    <script>
      // Global error logging for native Tauri webview stderr telemetry
      window.addEventListener('error', function(e) {
        console.error('[QL Studio Error]', e.message, 'at', e.filename + ':' + e.lineno, e.error);
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.warn('[QL Studio Unhandled Rejection]', e.reason);
      });
    </script>
  </head>
  <body class="bg-[#16191e] text-zinc-100 antialiased selection:bg-amber-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
