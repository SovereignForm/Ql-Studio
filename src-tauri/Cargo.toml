[package]
name = "ql-studio-core"
version = "0.1.0"
description = "Ql Studio — High-Performance Zero-Allocation DAW Engine (Tauri v2 + Rust Core)"
license = "GPL-3.0-or-later"
authors = ["SovereignForm"]
edition = "2021"

[lib]
name = "ql_studio_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cpal = "0.15"
rtrb = "0.3"
hound = "3.5"
tauri-plugin-dialog = "2.0.0"
vst3-host = { version = "0.11.1", default-features = false }
clack-host = "0.2.0"
midir = "0.11.1"
